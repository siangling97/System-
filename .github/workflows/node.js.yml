name: Capstone CI

on: [push, pull_request]

jobs:
  test:
    # Pinned so the upcoming ubuntu-latest switch to Ubuntu 26 can't break the Puppeteer tests unannounced.
    runs-on: ubuntu-24.04

    services:
      postgres:
        image: postgres:16-alpine
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL_TEST: postgresql://postgres:postgres@127.0.0.1:5432
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js 24 (matches "engines" in package.json)
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: npm
          cache-dependency-path: |
            package-lock.json
            back-end/package-lock.json
            front-end/package-lock.json

      # Ubuntu 24.04 blocks the user namespaces Chrome's sandbox needs; re-allow them so Puppeteer can launch.
      - name: Allow Chrome sandbox
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      - name: npm install
        run: npm install

      - run: npm run build --if-present

      - name: Test frontend
        run: npm run test:frontend
        env:
          # Point the app at the local test backend, not the live Vercel API it falls back to.
          REACT_APP_API_BASE_URL: http://localhost:5001

      - name: Archive screenshots
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: screenshots
          path: front-end/.screenshots
          if-no-files-found: ignore

      - name: Test backend
        if: always()
        run: npm run test:backend
